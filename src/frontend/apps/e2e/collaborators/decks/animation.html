<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>E2E animation</title>
<script type="application/json" id="collaborators-presentation">{"kind": "animation", "seconds": 6}</script>
<style>
  @page { size: 1280px 720px; margin: 0; }
