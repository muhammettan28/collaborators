<!doctype html>
<html><head><meta charset="utf-8"><title>E2E deck B</title>
<style>html,body{margin:0;height:100%;font:48px system-ui}.s{display:none;height:100vh;place-items:center;background:#fe8}.s.on{display:grid}</style></head>
<body><div class="s on">B · Slide 1</div><div class="s">B · Slide 2</div>
<script>var i=0,s=document.querySelectorAll('.s');addEventListener('keydown',function(e){if(e.key==='ArrowRight'&&i<s.length-1){s[i].classList.remove('on');s[++i].classList.add('on')}});</script>
</body></html>
